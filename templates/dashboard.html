[[extend 'layout.html']]

<div class="flex flex-col gap-6">

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

        <div
            class="bg-white p-5 rounded-card border border-outline-variant login-card-shadow flex items-center gap-4 transition-all hover:shadow-md">
            <div class="p-3 bg-primary/10 rounded-xl text-primary flex items-center justify-center">
                <span class="material-symbols-outlined text-2xl">group</span>
            </div>
            <div>
                <p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Total Employees</p>
                <h3 class="text-2xl font-bold text-on-surface mt-0.5">1,245</h3>
            </div>
        </div>

        <div
            class="bg-white p-5 rounded-card border border-outline-variant login-card-shadow flex items-center gap-4 transition-all hover:shadow-md">
            <div class="p-3 bg-emerald-50 rounded-xl text-emerald-600 flex items-center justify-center">
                <span class="material-symbols-outlined text-2xl">task_alt</span>
            </div>
            <div>
                <p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Present Today</p>
                <h3 class="text-2xl font-bold text-on-surface mt-0.5">94.2%</h3>
            </div>
        </div>

        <div
            class="bg-white p-5 rounded-card border border-outline-variant login-card-shadow flex items-center gap-4 transition-all hover:shadow-md">
            <div class="p-3 bg-tertiary-fixed rounded-xl text-tertiary flex items-center justify-center">
                <span class="material-symbols-outlined text-2xl">pending_actions</span>
            </div>
            <div>
                <p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Leave Requests</p>
                <h3 class="text-2xl font-bold text-on-surface mt-0.5">12</h3>
            </div>
        </div>

    </div>

    <div class="bg-white p-6 rounded-card border border-outline-variant login-card-shadow">
        <div class="flex items-center justify-between border-b border-outline-variant pb-4 mb-4">
            <h3 class="font-bold text-on-surface text-base">Recent Activities</h3>
            <span class="text-xs text-primary font-medium cursor-pointer hover:underline">View All</span>
        </div>

        <div
            class="text-sm text-on-surface-variant leading-relaxed py-4 text-center border border-dashed border-outline rounded-xl bg-surface-container">
            <span class="material-symbols-outlined text-outline text-4xl block mb-2">analytics</span>
            এখানে আপনার কোম্পানির রিয়েল-টাইম বায়োমেট্রিক বা মডিউল লগ ডেটা টেবিল আকারে শো করা যাবে।
        </div>
    </div>
</div>
