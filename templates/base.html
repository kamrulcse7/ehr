<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();
    </script>
    <title>[[=globals().get('page_title', 'HRMS Admin')]]</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#e2e8f0",
                        "on-secondary-container": "#5c647a",
                        "outline": "#94a3b8",
                        "background": "#f8fafc",
                        "surface-dim": "#d9d9e5",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#bc4800",
                        "surface-container-highest": "#f1f5f9",
                        "surface-bright": "#faf8ff",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#2563eb",
                        "surface-variant": "#e1e2ed",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#64748b",
                        "secondary-fixed": "#dae2fd",
                        "inverse-surface": "#2e3039",
                        "surface-container": "#f8fafc",
                        "tertiary": "#943700",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ffdbcd",
                        "on-primary-fixed": "#00174b",
                        "on-error": "#ffffff",
                        "on-background": "#0f172a",
                        "surface": "#ffffff",
                        "secondary-container": "#dae2fd",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "inverse-on-surface": "#f0f0fb",
                        "on-secondary-fixed-variant": "#3f465c",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-container": "#eeefff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-tint": "#2563eb",
                        "on-surface": "#0f172a",
                        "inverse-primary": "#b4c5ff",
                        "on-tertiary-container": "#ffede6",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#131b2e",
                        "on-tertiary-fixed": "#360f00",
                        "surface-container-high": "#e7e7f3",
                        "secondary": "#475569",
                        "primary": "#2563eb",
                        "surface-container-low": "#f8fafc",
                        "error": "#ef4444",
                        "secondary-fixed-dim": "#bec6e0"
                    },
                    "borderRadius": { "card": "16px" }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 100%);
        }

        html.dark body {
            background: radial-gradient(circle at top right, #1a2333 0%, #0f1622 100%);
        }

        .login-card-shadow {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05), 0 20px 25px -5px rgb(0 0 0 / 0.03);
        }

        html.dark .login-card-shadow {
            box-shadow: 0 4px 20px -1px rgb(0 0 0 / 0.6), 0 20px 30px -5px rgb(0 0 0 / 0.4);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }


        html.dark input:-webkit-autofill,
        html.dark input:-webkit-autofill:hover,
        html.dark input:-webkit-autofill:focus,
        html.dark input:-webkit-autofill:active {
            -webkit-background-clip: text;
            -webkit-text-fill-color: #f3f4f6 !important;
            transition: background-color 5000s ease-in-out 0s;
            box-shadow: inset 0 0 0 50px #1e293b !important;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">
    [[include]]
</body>

</html>
