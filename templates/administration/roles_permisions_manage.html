[[ extend 'layout.html' ]]
[[ import json ]]

<!-- Safe Static JSON Binding -->
<script>
    window.MODULE_GROUPS = [[= XML(json.dumps(module_groups)) if module_groups else '[]' ]];
</script>

<div class="w-full space-y-4 text-slate-700 dark:text-slate-200">
    <div class="max-w-[1800px] mx-auto space-y-4">

        <!-- HEADER / BREADCRUMB -->
        <div
            class="flex items-center justify-between gap-2 pb-2.5 border-b border-slate-200/60 dark:border-slate-800/60">
            <div class="flex items-center gap-1 text-[11px] font-medium tracking-tight min-w-0">
                <span class="text-slate-400 dark:text-slate-500 truncate">Administration</span>
                <span
                    class="material-symbols-outlined text-[12px] text-slate-300 dark:text-slate-600 select-none shrink-0">chevron_right</span>
                <a href="[[=URL('administration/roles_permisions')]]"
                    class="text-slate-400 hover:text-primary dark:text-slate-500 truncate transition-colors">Role
                    Management</a>
                <span
                    class="material-symbols-outlined text-[12px] text-slate-300 dark:text-slate-600 select-none shrink-0">chevron_right</span>
                <span class="text-primary font-bold truncate">[[= 'Edit Role' if role_id else 'Create Role' ]]</span>
            </div>

            <!-- Back Link -->
            <button type="button" onclick="window.history.back()"
                class="inline-flex items-center justify-center gap-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-md font-semibold text-[10px] transition-all">
                <span class="material-symbols-outlined text-[14px]">arrow_back</span>
                <span>Back</span>
            </button>
        </div>

        <!-- MAIN FORM -->
        <form id="role-form" onsubmit="handleFormSubmit(event)" class="space-y-5">

            <input type="hidden" id="role_id" value="[[= role_id or '' ]]">

            <!-- BASIC INFO -->
            <div
                class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm p-4 space-y-4">
                <h2
                    class="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider border-b border-slate-100 dark:border-slate-800 pb-2">
                    Basic Information
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                            Role Name <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="role_name" required value="[[= role_name or '' ]]"
                            placeholder="e.g. Sales Manager, HR Executive" autocomplete="off"
                            class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 focus:bg-white dark:focus:bg-slate-900 focus:border-primary focus:outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                            Description
                        </label>
                        <input type="text" id="description" value="[[= description or '' ]]"
                            placeholder="Short summary of responsibilities" autocomplete="off" maxlength="50"
                            class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 focus:bg-white dark:focus:bg-slate-900 focus:border-primary focus:outline-none transition-all">
                    </div>
                </div>
            </div>

            <!-- PERMISSIONS MATRIX -->
            <div
                class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm overflow-hidden">
                <div
                    class="flex items-center justify-between px-4 py-3 border-b border-slate-100 dark:border-slate-800">
                    <h2 class="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider">
                        Configure Permissions
                    </h2>

                    <div class="flex items-center gap-3 text-[11px]">
                        <button type="button" onclick="toggleAllCheckboxes(true)"
                            class="text-primary font-bold hover:underline">Select All</button>
                        <span class="text-slate-300 dark:text-slate-700">|</span>
                        <button type="button" onclick="toggleAllCheckboxes(false)"
                            class="text-slate-500 hover:underline">Clear All</button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-slate-100/70 dark:bg-slate-800/60 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 border-b border-slate-200/80 dark:border-slate-800">
                                <th class="py-2.5 px-4 min-w-[200px]">Navigation / Module</th>
                                <th class="py-2.5 px-2 text-center w-16">View</th>
                                <th class="py-2.5 px-2 text-center w-16">Create</th>
                                <th class="py-2.5 px-2 text-center w-16">Edit</th>
                                <th class="py-2.5 px-2 text-center w-16">Delete</th>
                                <th class="py-2.5 px-2 text-center w-16">Export</th>
                                <th class="py-2.5 px-2 text-center w-16">Approve</th>
                            </tr>
                        </thead>
                        <tbody id="permissions-editor-tbody"
                            class="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs">
                            <!-- JS Dynamic Matrix -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="flex items-center justify-end gap-3 pt-2">
                <a href="[[=URL('administration/roles_permisions')]]"
                    class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    Cancel
                </a>
                <button type="submit" id="save-btn"
                    class="inline-flex items-center gap-1.5 px-5 py-2 bg-primary hover:opacity-90 active:scale-[0.98] text-white rounded-xl text-xs font-bold shadow-md shadow-primary/20 transition-all">
                    <span class="material-symbols-outlined text-[16px]">save</span>
                    <span>[[= 'Update Role' if role_id else 'Save Role' ]]</span>
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    const actionKeys = [
        'can_view', 'can_create', 'can_edit', 'can_delete',
        'can_export', 'can_approve'
    ];

    function renderPermissionsForm() {
        const tbody = document.getElementById('permissions-editor-tbody');
        if (!window.MODULE_GROUPS || window.MODULE_GROUPS.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" class="text-center py-6 text-slate-400">No modules available.</td></tr>`;
            return;
        }

        let html = '';
        window.MODULE_GROUPS.forEach(group => {
            html += `
                <tr class="bg-slate-50/80 dark:bg-slate-800/40 text-[10px] font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase">
                    <td colspan="10" class="py-2 px-4">${group.module_group || ''} Group</td>
                </tr>`;

            (group.modules || []).forEach(module => {
                html += `
                    <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="py-2.5 px-4 whitespace-nowrap">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-[18px] text-primary shrink-0 select-none">
                                    ${module.module_icon || 'extension'}
                                </span>
                                <span class="font-bold text-[11px] text-slate-900 dark:text-white">${module.module_name || ''}</span>
                            </div>
                        </td>`;

                actionKeys.forEach(key => {
                    // সরাসরি module-এর ভেতরের Boolean চেক হচ্ছে
                    const isChecked = module[key] === true;
                    html += `
                        <td class="py-2.5 px-2 text-center">
                            <input type="checkbox" 
                                   data-module-id="${module.module_id}" 
                                   data-action="${key}" 
                                   class="perm-checkbox w-4 h-4 text-primary bg-slate-100 border-slate-300 rounded focus:ring-primary focus:ring-1 dark:bg-slate-800 dark:border-slate-700 cursor-pointer"
                                   ${isChecked ? 'checked' : ''}>
                        </td>`;
                });

                html += `</tr>`;
            });
        });

        tbody.innerHTML = html;
    }

    function toggleAllCheckboxes(status) {
        document.querySelectorAll('.perm-checkbox').forEach(cb => cb.checked = status);
    }

    function handleFormSubmit(e) {
        e.preventDefault();

        const roleId = document.getElementById('role_id').value;
        const roleName = document.getElementById('role_name').value.trim();
        const description = document.getElementById('description').value.trim();

        const modulePerms = {};
        document.querySelectorAll('.perm-checkbox').forEach(cb => {
            const moduleId = cb.getAttribute('data-module-id');
            const action = cb.getAttribute('data-action');

            if (!modulePerms[moduleId]) {
                modulePerms[moduleId] = { module_id: moduleId };
            }
            modulePerms[moduleId][action] = cb.checked;
        });

        const payload = {
            role_id: roleId ? roleId : null,
            role_name: roleName,
            description: description,
            permissions: Object.values(modulePerms)
        };

        console.log("Form Submitted Payload:", payload);
        alert(`Form submitted successfully!\nRole Mode: ${roleId ? 'Edit' : 'Create'}\nCheck browser console for payload.`);

        // Redirect back
        window.location.href = "[[=URL('administration/roles_permisions')]]";
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderPermissionsForm();
    });
</script>
